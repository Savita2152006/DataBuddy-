<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataBuddy - AI-Powered CSV Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }
    .error { color: red; font-weight: bold; }
    .success { color: green; font-weight: bold; }

    /* Enable horizontal scroll for wide tables */
    #output {
      overflow-x: auto;
      white-space: nowrap;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: max-content;
    }

    th, td {
      padding: 8px 12px;
      border: 1px solid #ccc;
      text-align: left;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white">

  <div class="max-w-4xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-6 text-center">📊 DataBuddy — Chat with Your CSV</h1>

    <!-- Upload Section -->
    <div class="bg-white text-slate-900 p-6 rounded-xl shadow mb-6">
      <label class="font-semibold">Upload CSV file:</label>
      <input type="file" id="csvFile" class="block w-full mt-2 mb-4 border p-2 rounded">
      <button onclick="uploadCSV()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Upload</button>
      <div id="uploadMsg" class="mt-2"></div>
    </div>

    <!-- Hint Section -->
    <div class="bg-blue-50 text-blue-900 p-4 rounded-xl border mb-6">
      <p class="font-medium mb-2">💡 Try commands like:</p>
      <ul class="list-disc list-inside">
        <li>first 5 rows</li>
        <li>show all</li>
        <li>describe</li>
        <li>average of salary</li>
        <li>scatter of age vs salary</li>
        <li>bar chart of city</li>
        <li>df['city'].value_counts()</li>
        <li>export</li>
      </ul>
    </div>

    <!-- Command Section -->
    <div class="bg-white text-slate-900 p-6 rounded-xl shadow mb-6">
      <label class="font-semibold">Type your command:</label>
      <textarea id="commandBox" placeholder="Type your command here..." class="block w-full mt-2 p-2 border rounded min-h-[100px]"></textarea>
      <div class="mt-4 flex flex-wrap gap-2">
        <button onclick="sendCommand()" id="submitBtn" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Submit Command</button>
        <button onclick="downloadExcel()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">📥 Download Final Excel</button>
        <button onclick="getHistory()" class="bg-slate-600 text-white px-4 py-2 rounded hover:bg-slate-700">📜 View History</button>
      </div>
    </div>

    <!-- History Section -->
    <div id="historyOutput" class="bg-white text-slate-900 p-4 rounded-xl shadow mb-6 max-h-48 overflow-y-auto">
      <em class="text-slate-500">No commands yet</em>
    </div>

    <!-- Output Section -->
    <div id="output" class="bg-white text-slate-900 p-6 rounded-xl shadow overflow-x-auto">
      <em>⚡ Output will appear here...</em>
    </div>
  </div>

  <script>
    let isProcessing = false;

    function uploadCSV() {
      const fileInput = document.getElementById('csvFile');
      const uploadMsg = document.getElementById('uploadMsg');
      const formData = new FormData();

      if (!fileInput.files.length) {
        uploadMsg.innerHTML = "<p class='error'>❌ Please select a CSV file first.</p>";
        return;
      }

      formData.append("file", fileInput.files[0]);

      uploadMsg.innerHTML = "<p class='text-blue-600'>📤 Uploading...</p>";

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          uploadMsg.innerHTML = `<p class='success'>${data.message}</p>`;
        } else if (data.error) {
          uploadMsg.innerHTML = `<p class='error'>${data.error}</p>`;
        }
      })
      .catch(err => {
        uploadMsg.innerHTML = `<p class='error'>❌ Upload failed: ${err.message}</p>`;
      });
    }

    function sendCommand() {
      const commandText = document.getElementById("commandBox").value.trim();
      const outputDiv = document.getElementById("output");
      const submitBtn = document.getElementById("submitBtn");

      if (!commandText || isProcessing) return;

      isProcessing = true;
      submitBtn.innerHTML = '⏳ Processing...';
      submitBtn.disabled = true;
      outputDiv.innerHTML = "<p>⏳ Processing your command...</p>";

      fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: commandText })
      })
      .then(response => response.json())
      .then(data => {
        if (data.result !== undefined) {
          outputDiv.innerHTML = data.result;
        } else if (data.plot_url) {
          outputDiv.innerHTML = `<img src="${data.plot_url}" alt="Generated Plot">`;
        } else if (data.file_url) {
          outputDiv.innerHTML = `<p><a href="${data.file_url}" download>📥 Download Modified Excel</a></p>`;
        } else if (data.error) {
          outputDiv.innerHTML = `<p class='error'>❌ ${data.error}</p>`;
        } else {
          outputDiv.innerHTML = `<p>⚠ Unexpected response</p>`;
        }
        document.getElementById("commandBox").value = "";
        submitBtn.innerHTML = 'Submit Command';
        submitBtn.disabled = false;
        isProcessing = false;

        addToHistory(commandText);
      })
      .catch(err => {
        outputDiv.innerHTML = `<p class='error'>❌ Error: ${err.message}</p>`;
        submitBtn.innerHTML = 'Submit Command';
        submitBtn.disabled = false;
        isProcessing = false;
      });
    }

    function addToHistory(command) {
      const historyDiv = document.getElementById("historyOutput");
      const currentHistory = historyDiv.innerHTML;

      if (currentHistory.includes("No commands yet")) {
        historyDiv.innerHTML = `<div class="space-y-2"><div class="p-2 bg-white rounded border text-sm">${command}</div></div>`;
      } else {
        historyDiv.innerHTML = `<div class="space-y-2"><div class="p-2 bg-white rounded border text-sm">${command}</div>${currentHistory}</div>`;
      }
    }

    function getHistory() {
      fetch("/history")
        .then(res => res.json())
        .then(data => {
          const list = data.history.map(cmd => `<li>${cmd}</li>`).join("");
          document.getElementById("historyOutput").innerHTML = `<ul>${list}</ul>`;
        });
    }

    function downloadExcel() {
      fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: "export" })
      })
      .then(res => res.json())
      .then(data => {
        if (data.file_url) {
          window.open(data.file_url, "_blank");
        } else {
          alert("❌ No Excel file available. Try modifying your data first.");
        }
      })
      .catch(err => {
        alert("❌ Download failed: " + err.message);
      });
    }

    document.getElementById("commandBox").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendCommand();
      }
    });
  </script>
</body>
</html>
